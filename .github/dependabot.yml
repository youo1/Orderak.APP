# Dependency updates.
#
# This file replaces renovate.json, which configured a Renovate App that was
# never installed on this repository: no Renovate pull request or dependency
# dashboard was ever opened here. The config described grouping, pinning, and
# patch auto-merge that nothing was performing, so the repository appeared to
# have dependency automation while having none.
#
# Dependabot security updates are already enabled on this repository, but those
# only act on published advisories. Routine version updates — the work
# renovate.json was actually written for — need this file.
#
# Groups mirror the intent of the renovate.json packageRules they replace, so
# one review covers a toolchain rather than arriving as separate pull requests.
# TEMPORARY, 2026-08-24 — solo pre-release development: the three schedules
# below were weekly and are now monthly, to cut review load. Security updates
# are unaffected; those are a repository setting and arrive on advisory, not on
# this schedule.
version: 2
#
# target-branch: develop — dependency updates enter the integration branch and
# reach production the same way everything else does, through
# develop -> staging -> main.
#
# Between 2026-08-24 and 2026-08-25 every entry carried `target-branch: develop`.
# That was load-bearing while `develop` existed, for a reason worth keeping on
# record: Dependabot treats its configured target as authoritative, so
# retargeting one of its pull requests by hand and then asking it to rebase makes
# it reset the base back to the configured branch. Three bumps reached `main`
# that way before the setting existed. Dependabot also reads this file from the
# default branch only, so the setting did nothing until it landed on `main`.
#
updates:
  # pnpm workspace. Dependabot resolves every workspace member from the root
  # pnpm-lock.yaml, so a single root entry covers apps/, services/, and
  # contracts/ rather than one entry per package.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Africa/Cairo
    # A version published minutes ago has been reviewed by nobody. Waiting a
    # week is the standard defence against a compromised release being proposed
    # before the ecosystem has noticed it — the shape most supply-chain attacks
    # on package registries take.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cloudflare-wrangler:
        patterns: ["wrangler", "@cloudflare/*", "miniflare"]
      react-vite:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "vite", "@vitejs/*", "tailwindcss", "@tailwindcss/*"]
      dev-tooling:
        patterns: ["oxlint", "vitest", "@vitest/*", "playwright", "@playwright/*", "tsx", "typescript"]
      sentry:
        patterns: ["@sentry/*"]
      # Everything else, patch and minor only. Majors still arrive on their own
      # so a breaking change is never bundled with routine upgrades.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Each of these was attempted, measured and reverted. They are blocked on
      # real code work, not on caution, and each one passes a *partial* check --
      # which is exactly how a "tests pass, ship it" merge lands one.
      #
      # typescript 7 removes the compiler API from the package entry point; it
      # exports only `version` and `versionMajorMinor`. contracts/openapi/scripts/hono-inventory.mjs
      # uses ts.createSourceFile and ts.ScriptTarget to prove every Hono route is
      # documented, so route coverage stops running entirely. Backend tests, tsc,
      # oxlint and the admin-web build all still pass, and openapi-ci.yml is
      # path-filtered so it does not even run on a package.json bump. Unblocking
      # means reparenting that script onto another parser.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @material/material-color-utilities 0.4 drops `sourceColorArgb` from
      # DynamicSchemeOptions: 26 backend tests fail, test:types breaks, and
      # design-system:check crashes. The fix in
      # services/backend/src/domains/design/design-system.ts changes generated
      # colour output, so it is a design change needing visual review.
      - dependency-name: "@material/material-color-utilities"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # @types/node tracks the runtime, and .nvmrc pins Node 24. A 26.x bump was
      # merged on 2026-08-24 and is reverted in this same change: types for APIs
      # the runtime does not have will typecheck and then fail at run time.
      # Raise .nvmrc first, then this.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Android / Compose / Kotlin toolchain.
  - package-ecosystem: gradle
    directory: /apps/seller-android
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Africa/Cairo
    # A version published minutes ago has been reviewed by nobody. Waiting a
    # week is the standard defence against a compromised release being proposed
    # before the ecosystem has noticed it — the shape most supply-chain attacks
    # on package registries take.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      android-compose:
        update-types: [minor, patch]
    ignore:
      # Kotlin and AGP majors were dependencyDashboardApproval in renovate.json:
      # they move jvmTarget and the Compose compiler together and must be taken
      # deliberately, not as an incidental pull request.
      - dependency-name: org.jetbrains.kotlin:*
        update-types: [version-update:semver-major]
      - dependency-name: com.android.tools.build:gradle
        update-types: [version-update:semver-major]

  # Action versions. Every workflow here pins actions by commit SHA; Dependabot
  # updates the SHA and rewrites the trailing version comment, so pinning is
  # kept rather than traded away for update coverage.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Africa/Cairo
    # A version published minutes ago has been reviewed by nobody. Waiting a
    # week is the standard defence against a compromised release being proposed
    # before the ecosystem has noticed it — the shape most supply-chain attacks
    # on package registries take.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
