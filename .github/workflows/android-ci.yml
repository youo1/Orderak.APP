name: Android CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Create CI Firebase configuration
        run: bash .github/scripts/write-ci-google-services.sh

      - name: Assemble staging application
        working-directory: apps/seller-android
        run: bash ./gradlew :app:assembleStagingDebug --stacktrace

      - name: Verify versioned safety and seller API contracts
        working-directory: apps/seller-android
        run: >
          bash ./gradlew
          :app:verifyAuthPhase1Contract
          :app:verifyLocalizationContract
          :app:verifySellerApiContract
          --stacktrace

      - name: Run staging and production URL contract tests
        working-directory: apps/seller-android
        run: bash ./gradlew :app:testStagingDebugUnitTest :app:testProductionDebugUnitTest --stacktrace

      - name: Run Android staging lint
        working-directory: apps/seller-android
        run: bash ./gradlew :app:lintStagingDebug --stacktrace

      # Offline half of the pin guard: expiration and backup-pin count. The live
      # chain check runs on a schedule in infra-drift.yml instead, because a
      # network call a developer can make pass by re-running it is not a gate.
      #
      # This fails 90 days before the pin set lapses, which is the window a Play
      # release needs to reach installed devices. See
      # docs/runbooks/certificate-pinning.md.
      - name: Verify Android certificate pin set
        run: node tooling/repository/verify-certificate-pins.mjs

  screenshot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Create CI Firebase configuration
        run: bash .github/scripts/write-ci-google-services.sh
      - name: Validate Compose screenshot tests
        working-directory: apps/seller-android
        run: bash ./gradlew :app:validateStagingDebugScreenshotTest --stacktrace
      # The plugin writes under outputs/screenshotTest-results, not the
      # screenshot-test directory this step used to name. The mismatch was
      # invisible while the task passed, and produced an empty artifact the
      # first time it failed — leaving nothing to look at for the one failure
      # a screenshot test exists to explain.
      - name: Upload screenshot diff report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          path: |
            apps/seller-android/app/build/outputs/screenshotTest-results/**/*.png
            apps/seller-android/app/build/reports/screenshotTest/**
          if-no-files-found: error
          retention-days: 7

  apk-size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Create CI Firebase configuration
        run: bash .github/scripts/write-ci-google-services.sh
      - name: Build staging bundle
        working-directory: apps/seller-android
        run: bash ./gradlew :app:bundleStagingDebug --stacktrace
      - name: Check APK size
        run: |
          SIZE=$(stat -c%s apps/seller-android/app/build/outputs/bundle/stagingDebug/app-staging-debug.aab 2>/dev/null || echo 0)
          echo "Bundle size: $SIZE bytes"
          # Start generous at 50 MB, tighten over time
          if [ "$SIZE" -gt 52428800 ]; then echo "ERROR: Bundle exceeds 50 MB threshold"; exit 1; fi
        shell: bash

  # The release variant, built on every pull request.
  #
  # It was configured and never assembled: minify, resource shrinking and
  # ProGuard were all declared while every build anyone ran was `debug`. A
  # release-only R8 failure would therefore have been discovered by whoever
  # first tried to publish, which is the worst possible moment to learn that
  # Room, Hilt or kotlinx.serialization needed a keep rule.
  #
  # Staging, not production: the production Firebase config in CI is a
  # deliberate placeholder and `verifyFirebaseConfiguration` fails on it. Both
  # share the `release` build type, so this exercises the same R8 configuration
  # the published bundle uses.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Create CI Firebase configuration
        run: bash .github/scripts/write-ci-google-services.sh
      - name: Assemble minified release bundle
        working-directory: apps/seller-android
        run: bash ./gradlew :app:bundleStagingRelease -PorderakVersionCode=${{ github.run_number }} --stacktrace
      - name: Check release bundle size
        run: |
          AAB=apps/seller-android/app/build/outputs/bundle/stagingRelease/app-staging-release.aab
          SIZE=$(stat -c%s "$AAB" 2>/dev/null || echo 0)
          echo "Release bundle size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then echo "ERROR: no release bundle produced"; exit 1; fi
          if [ "$SIZE" -gt 52428800 ]; then echo "ERROR: bundle exceeds 50 MB threshold"; exit 1; fi
        shell: bash
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-staging-release
          path: apps/seller-android/app/build/outputs/mapping/stagingRelease/**
          if-no-files-found: warn
          retention-days: 7

  localization-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check localization key parity
        run: |
          BASE="apps/seller-android/app/src/main/res/values/strings.xml"
          for LOCALE in ar en fr; do
            # translatable="false" marks a string deliberately not localized —
            # app_name is "Orderak" in every locale. Counting those as missing
            # translations fails the check on strings that are correct by design,
            # which is exactly what happened the first time this job ran.
            BASE_KEYS=$(grep -v 'translatable="false"' "$BASE" | grep -oP 'name="\K[^"]+' | sort)
            LOC_KEYS=$(grep -oP 'name="\K[^"]+' "apps/seller-android/app/src/main/res/values-${LOCALE}/strings.xml" | sort)
            MISSING=$(comm -23 <(echo "$BASE_KEYS") <(echo "$LOC_KEYS"))
            EXTRA=$(comm -13 <(echo "$BASE_KEYS") <(echo "$LOC_KEYS"))
            if [ -n "$MISSING" ]; then echo "ERROR: values-${LOCALE} missing keys: $MISSING"; exit 1; fi
            if [ -n "$EXTRA" ]; then echo "WARNING: values-${LOCALE} has extra keys: $EXTRA"; fi
          done
          echo "All locales match base key set."
        shell: bash

  # connectedStagingDebugAndroidTest — instrumented locale matrix (ar, en, fr, en-XA, ar-XB).
  # Not currently run in CI — requires an Android emulator. This is a local-only gate
  # documented in AGENTS.md. To enable: add an emulator job with
  # reactivecircus/android-emulator-runner and run:
  #   bash ./gradlew :app:connectedStagingDebugAndroidTest --stacktrace
