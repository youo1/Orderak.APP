name: AI Customizations CI

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/hooks/**'
      - '.github/copilot/**'
      - '.github/plugin/**'
      - '.github/mcp.json'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ai-customizations-ci.yml'
      - '.github/workflows/skills-auto-update.yml'
      - '.vscode/mcp.json'
      - '.vscode/settings.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-customizations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate customization structure
        run: node .github/skills/orderak-agent-improvement/scripts/validate-customizations.mjs

      - name: Test hook and verification helpers
        run: >
          node --test
          .github/hooks/scripts/hooks.test.mjs
          .github/skills/orderak-agent-improvement/scripts/record-learning.test.mjs
          .github/skills/orderak-verification/scripts/verify.test.mjs
