name: Security Scan

# Two checks that catch the mistakes no reviewer reliably catches:
#
#   * gitleaks — a committed credential. `.dev.vars` is gitignored and has
#     never been committed, but that is a convention, not a control. This is
#     the control.
#   * dependency-review — a dependency introduced by a pull request that
#     carries a known vulnerability, before it is merged rather than after.
#
# Scoped to pull requests and to main so every route into the default branch is
# covered. Runs on every path deliberately: a secret can be committed into any
# file, so a paths filter here would be a hole rather than an optimisation.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # THREAT-MODEL DECISION (reviewed 2026-08): gitleaks-action posts findings
      # as pull-request comments through the GitHub API. With only contents:read
      # it fails before scanning with
      #   RequestError [HttpError]: Resource not accessible by integration (403)
      # which reads like a scan failure but is a permissions one.
      #
      # Why `pull-requests: write` is accepted here rather than split out:
      #   1. It grants no `contents: write`, no `actions`, and no secret access;
      #      comments are the only thing it can mutate.
      #   2. On a pull_request from a fork, GitHub downgrades the token to
      #      read-only regardless, so an untrusted branch cannot mint comments.
      #   3. The action runs as a pinned-SHA, code-reviewed step; it receives no
      #      attacker-controlled script input.
      # If the action ever needs broader write scope, split the commenter into a
      # separate, workflow_run-gated job instead of widening this one.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks compares against history, so a shallow clone would miss a
          # secret added in an earlier commit on the same branch.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The action writes results.sarif only when it finds something, then
          # tries to upload it unconditionally - so a clean scan fails the job
          # with "File results.sarif does not exist". A pass looking exactly like
          # a failure is worse than no check at all. Findings are still reported
          # as PR comments and still fail the job through its exit code; only the
          # artifact upload is off.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: the action diffs the base and head
    # manifests, and there is no base to diff against on a push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        # Requires Dependency graph and GitHub Advanced Security on the
        # repository. Without them the action exits with "Dependency review is
        # not supported on this repository" on every single run. Non-blocking at
        # the step rather than the job, because job-level continue-on-error still
        # reports the check itself as failed. It stays in place so it starts
        # working the moment those are enabled in Settings > Code security — a
        # check that can never pass only teaches people to ignore a red tick.
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
