name: Infrastructure Drift

# Compares the Cloudflare resources the wrangler configs declare against what
# the account actually has.
#
# This exists because of a specific outage. On 2026-08-01 the email queues were
# created and the Workers registered as their consumers, server-side, with no
# config declaring it. Nothing noticed for a week, until the next push to main
# touching the backend failed with "Queue handler is missing [code: 11001]" and
# took production deploys down. The divergence existed the whole time and was
# only ever going to surface as an unrelated deploy failing.
#
# This repository owns the daily drift check as of 2026-08-16, and removed it
# from the old repository in the same change. It follows production: this
# repository now deploys production, so it checks production for drift.

on:
  schedule:
    # Daily at 06:00 UTC. Moved from the old repository 2026-08-16: this
    # repository now owns production, so it owns the drift check against it.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: Also fail on resources that exist but are undeclared
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The old repository's copy of this line was `secrets.CLOUDFLARE_D1_BACKUP_TOKEN
      # || secrets.CLOUDFLARE_API_TOKEN`. That fallback broke there this session: once
      # the backup token was correctly narrowed to D1+R2 only, this check silently lost
      # the D1/R2/Queues List access it actually needs. A single, dedicated read-only
      # token removes the ambiguity — see the migration plan's token-rotation notes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.ORDERAK_DRIFT_CHECK }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: services/backend

      - name: Preflight — credentials present
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ERROR: Cloudflare credentials are not set in the 'production' environment."
            echo "  The check reads live account state and cannot run without them."
            exit 1
          fi

      - name: Check for drift
        working-directory: services/backend
        env:
          STRICT_MODE: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          if [ "$STRICT_MODE" = "true" ]; then
            node scripts/verify-cloudflare-drift.mjs --strict
          else
            node scripts/verify-cloudflare-drift.mjs
          fi

      # Queue depth is not in `wrangler queues info`; it exists only in the
      # GraphQL Analytics API. Without this there was no measured number behind
      # the queue-backlog rollback trigger, and the stand-in was "any message in
      # a DLQ" — a real signal, but a late one: by the time a message
      # dead-letters, the backlog that caused it already happened.
      #
      # Reports only for now. It gains --max-messages once a baseline exists;
      # setting a bound before measuring is how you get a trigger that either
      # never fires or always does.
      - name: Report queue backlog
        working-directory: services/backend
        continue-on-error: true
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.ORDERAK_ANALYTICS }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ANALYTICS_TOKEN}" ]; then
            echo "ORDERAK_ANALYTICS is not set — skipping the backlog report."
            echo "It needs Account Analytics:Read, which the deploy and backup tokens do not carry."
            exit 0
          fi
          node scripts/queue-backlog-report.mjs --hours 24
