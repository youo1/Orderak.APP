name: Infrastructure Drift

# Compares the Cloudflare resources the wrangler configs declare against what
# the account actually has.
#
# This exists because of a specific outage. On 2026-08-01 the email queues were
# created and the Workers registered as their consumers, server-side, with no
# config declaring it. Nothing noticed for a week, until the next push to main
# touching the backend failed with "Queue handler is missing [code: 11001]" and
# took production deploys down. The divergence existed the whole time and was
# only ever going to surface as an unrelated deploy failing.
#
# No schedule here yet — see the migration plan, Phase 3, on scheduled
# workflows staying manual until cutover. The old repository's daily run stays
# authoritative until then.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Also fail on resources that exist but are undeclared
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The old repository's copy of this line was `secrets.CLOUDFLARE_D1_BACKUP_TOKEN
      # || secrets.CLOUDFLARE_API_TOKEN`. That fallback broke there this session: once
      # the backup token was correctly narrowed to D1+R2 only, this check silently lost
      # the D1/R2/Queues List access it actually needs. A single, dedicated read-only
      # token removes the ambiguity — see the migration plan's token-rotation notes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DRIFT_CHECK_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: services/backend

      - name: Preflight — credentials present
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ERROR: Cloudflare credentials are not set in the 'production' environment."
            echo "  The check reads live account state and cannot run without them."
            exit 1
          fi

      - name: Check for drift
        working-directory: services/backend
        env:
          STRICT_MODE: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          if [ "$STRICT_MODE" = "true" ]; then
            node scripts/verify-cloudflare-drift.mjs --strict
          else
            node scripts/verify-cloudflare-drift.mjs
          fi
