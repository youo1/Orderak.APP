name: Deploy Staging

# No push trigger yet. The migration plan (Phase 3) is explicit: "Deploy,
# backup, drift, nightly and every scheduled workflow stay disabled or
# manual until cutover. Never copy schedules and leave both repositories
# acting on the same resources." The old repository still owns the push-to-
# staging path; this one gets it back — and its trigger restored — only
# after Phase 7a removes the old repository's staging deploy token.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderak-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile

      - name: Test and type-check backend
        working-directory: services/backend
        run: |
          pnpm test -- --run
          pnpm run test:types
          pnpm run cf-types:check

      - name: Validate staging Worker configurations
        working-directory: services/backend
        run: |
          npx wrangler deploy --env staging --dry-run
          npx wrangler deploy --config wrangler.admin.jsonc --env staging --dry-run

      - name: Install and validate Admin
        working-directory: apps/admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run lint
          pnpm run build
          pnpm run cf-types:check
          npx wrangler deploy --config wrangler.edge.staging.jsonc --dry-run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://admin.staging.orderak.app
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require deploy owner
        uses: ./.github/actions/require-deploy-owner
        with:
          expected-owner: ${{ vars.DEPLOY_OWNER }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile

      - name: Apply staging database migrations
        working-directory: services/backend
        run: |
          npx wrangler d1 migrations apply orderak_db --env staging --remote
          npx wrangler d1 migrations apply orderak_geo --env staging --remote

      - name: Deploy staging API and Admin Worker
        working-directory: services/backend
        run: |
          pnpm run deploy:staging
          pnpm run deploy:staging:admin

      - name: Build and deploy staging Admin
        working-directory: apps/admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run deploy:staging

      - name: Smoke-test staging
        run: |
          curl --fail --show-error --retry 5 --retry-delay 5 https://api.staging.orderak.app/health
          curl --fail --show-error --retry 5 --retry-delay 5 https://admin.staging.orderak.app/
