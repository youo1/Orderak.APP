name: Deploy Staging

# This repository owns staging deploys. It is the only one holding a staging
# deploy credential, so no other automation can reach these Workers.
#
# The push trigger was held back while both repositories could still reach
# the same Workers — the plan's rule was "never copy schedules and leave
# both repositories acting on the same resources." That condition no longer
# holds: youo1/Orderak's staging deploy credential was removed, and its own
# staging-deploy.yml is now break-glass only, dispatch-gated behind a typed
# confirmation. (This comment also credited "a required reviewer" there;
# that repository is private, and going private strips required_reviewers
# under the current plan — see docs/governance/phase9-readiness.md. The
# control that holds is the removed credential, which is the one that
# matters: no token, no deploy.) One repository deploys staging, and it is
# this one.
#
# Restored with the same path filters the source repository used, so a docs
# or Android-only change still does not redeploy the Workers.
#
# Trigger history, because this line has moved twice and the reason matters
# more than the current value:
#
#   * Until 2026-08-24 it was `main`.
#   * On 2026-08-24 it moved to `staging`, when the repository adopted
#     develop -> staging -> main.
#   * On 2026-08-25 it moved back to `main`, when the repository collapsed to a
#     single branch.
#   * Later on 2026-08-25 it moved to `staging` again, when develop -> staging
#     -> main was re-adopted. This is the current value.
#
# Three long-lived branches, two isolated runtime environments. `develop`
# deploys nowhere — there is no Dev environment and Staging serves as the
# integration environment. A merge to `staging` deploys Staging; Production
# stays dispatch-only behind the typed confirmation in production-deploy.yml,
# and deploys only a commit Staging already ran.

on:
  push:
    branches: [staging]
    paths:
      - 'services/backend/**'
      - 'apps/admin-web/**'
      - 'contracts/openapi/**'
      - 'apps/seller-android/app/build.gradle.kts'
      - 'tooling/repository/verify-deployment-map.mjs'
      - 'docs/architecture/deployment-environment-map.md'
      - '.github/workflows/staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderak-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile

      - name: Test and type-check backend
        working-directory: services/backend
        run: |
          pnpm test -- --run
          pnpm run test:types
          pnpm run cf-types:check

      - name: Validate staging Worker configurations
        working-directory: services/backend
        run: |
          npx wrangler deploy --env staging --dry-run
          npx wrangler deploy --config wrangler.admin.jsonc --env staging --dry-run

      - name: Install and validate Admin
        working-directory: apps/admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run lint
          pnpm run build
          pnpm run cf-types:check
          npx wrangler deploy --config wrangler.edge.staging.jsonc --dry-run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://admin.staging.orderak.app
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ORDERAK_DEPLOY_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require deploy owner
        uses: ./.github/actions/require-deploy-owner
        with:
          expected-owner: ${{ vars.DEPLOY_OWNER }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile

      - name: Apply staging database migrations
        working-directory: services/backend
        run: |
          npx wrangler d1 migrations apply orderak-db-staging --env staging --remote
          npx wrangler d1 migrations apply orderak-geo-staging --env staging --remote

      - name: Deploy staging API and Admin Worker
        working-directory: services/backend
        run: |
          pnpm run deploy:staging
          pnpm run deploy:staging:admin

      - name: Build and deploy staging Admin
        working-directory: apps/admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run deploy:staging

      - name: Smoke-test staging
        run: |
          curl --fail --show-error --retry 5 --retry-delay 5 https://api.staging.orderak.app/health
          curl --fail --show-error --retry 5 --retry-delay 5 https://admin.staging.orderak.app/
