name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA already verified on Staging
        required: true
        type: string
      confirm:
        description: Type DEPLOY_PRODUCTION to confirm the production deployment
        required: true
        type: string

# contents: write is needed only by the final step, which tags the deployed
# commit. It is a deliberate widening: without a tag, the only record of what
# is in production is this workflow run history, and Actions history is kept
# for 90 days. After that, "what shipped on date X" has no answer in GitHub at
# all. A tag is permanent and costs one API call.
permissions:
  contents: write
  actions: read

concurrency:
  group: orderak-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://admin.orderak.app
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ORDERAK_DEPLOY_PRODUCTION }}
      PRODUCTION_CONFIRM: ${{ inputs.confirm }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      # PRODUCTION FREEZE, 2026-08-24 — the project is in testing and delivery
      # is staging-only. This gate fails closed: with the repository variable
      # absent, `vars.PRODUCTION_DEPLOYS_ENABLED` expands to an empty string and
      # no production deploy can proceed. Nothing already running in production
      # is affected; this only stops new releases reaching it.
      #
      # To lift the freeze, set the repository variable
      # PRODUCTION_DEPLOYS_ENABLED to the string "true". Deliberately a variable
      # and not a code edit, so lifting it is one auditable settings change and
      # re-freezing is the same.
      - name: Production deploys are frozen
        env:
          ENABLED: ${{ vars.PRODUCTION_DEPLOYS_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Production deploys are frozen (PRODUCTION_DEPLOYS_ENABLED is not 'true'). The project is staging-only while in testing."
            exit 1
          fi

      - name: Verify explicit production confirmation
        shell: bash
        run: |
          test "$PRODUCTION_CONFIRM" = "DEPLOY_PRODUCTION"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - name: Require deploy owner
        uses: ./.github/actions/require-deploy-owner
        with:
          expected-owner: ${{ vars.DEPLOY_OWNER }}

      # RELEASE ELIGIBILITY
      #
      #   A release SHA is eligible if and only if it equals origin/main (checked
      #   in the next step) AND it has successful Staging deployment provenance —
      #   either directly, or as the promotion merge of a commit that does.
      #
      # Provenance comes from GitHub deployment records rather than workflow
      # runs. staging-deploy.yml's deploy job declares `environment: staging`, so
      # GitHub already records every Staging deployment against its SHA. A
      # deployment record states that this commit was deployed to that
      # environment and succeeded, which is the claim being made here; a
      # successful workflow run is only evidence for it.
      #
      # Two candidates, so the lookup is bounded by construction — no history
      # scan. Staging deploys fire on pushes to `staging`, so a `staging -> main`
      # promotion merge is itself a SHA Staging never deployed; the commit that
      # was deployed is its SECOND parent. The first parent is the previous
      # production release and is deliberately never consulted — accepting it
      # would pass a promotion whose staging side had never deployed at all.
      #
      # This makes the merge commit load-bearing: a squashed promotion has no
      # second parent and this gate will refuse the release. That failure is the
      # safe direction. Recovery is to dispatch Deploy Staging against `main`,
      # which creates a deployment record for the release SHA itself.
      - name: Verify the release has Staging deployment provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          deployed_to_staging() {
            local sha="$1"
            [ -n "$sha" ] || return 1
            local ids id state
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=staging&sha=${sha}&per_page=100" --jq '.[].id')
            for id in $ids; do
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // empty')
              if [ "$state" = "success" ]; then return 0; fi
            done
            return 1
          }

          # rev-list --parents reads the commit header only, so this works on the
          # shallow checkout above without fetching the parent objects.
          SECOND_PARENT=$(git rev-list --parents -n 1 HEAD | awk '{print $3}')

          if deployed_to_staging "$RELEASE_SHA"; then
            echo "Provenance: $RELEASE_SHA was itself deployed to Staging."
          elif [ -n "$SECOND_PARENT" ] && deployed_to_staging "$SECOND_PARENT"; then
            echo "Provenance: promotion merge; second parent $SECOND_PARENT was deployed to Staging."
          else
            echo "::error::No successful Staging deployment for $RELEASE_SHA or its second parent (${SECOND_PARENT:-none}). If this promotion was squashed rather than merged, dispatch Deploy Staging against main and retry."
            exit 1
          fi

      # From main: production may only ever deploy the tip of main. The staging
      # check above proves the commit was exercised; this proves it is also the
      # revision everyone else is looking at, so a side branch that happened to
      # pass staging cannot reach production.
      - name: Verify the release is the current main revision
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and validate backend
        working-directory: services/backend
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run
          pnpm run test:types
          pnpm run lint
          pnpm run verify:migrations
          pnpm run cf-types:check
          npx wrangler deploy --env="" --dry-run
          npx wrangler deploy --config wrangler.admin.jsonc --env="" --dry-run

      - name: Install and validate Admin
        working-directory: apps/admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run lint
          pnpm run build
          pnpm run cf-types:check
          npx wrangler deploy --config wrangler.edge.jsonc --env="" --dry-run

      # Migrations are the only step in this workflow that cannot be undone by
      # deploying the previous revision. A Worker rolls back; a dropped column
      # does not. Requiring a recent verified backup makes the restore point a
      # precondition of the deploy rather than something to go looking for
      # afterwards.
      #
      # This checks for a successful run rather than taking a backup inline:
      # d1-backup.yml exports, verifies, replays into a scratch database,
      # encrypts and uploads, and a second copy of that pipeline here would
      # drift from the one the restore runbook documents. If this step fails,
      # run the "D1 Backup" workflow and re-dispatch.
      - name: Require a verified backup from the last 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/d1-backup.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')
          if [ -z "$LATEST" ]; then
            echo "::error::No successful D1 Backup run found. Run the D1 Backup workflow before deploying."
            exit 1
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LATEST" +%s) ))
          echo "Most recent successful backup: $LATEST ($((AGE / 3600))h ago)"
          if [ "$AGE" -gt 86400 ]; then
            echo "::error::Most recent D1 Backup is $((AGE / 3600))h old. Run the D1 Backup workflow before deploying."
            exit 1
          fi

      - name: Apply production database migrations
        working-directory: services/backend
        run: |
          npx wrangler d1 migrations apply orderak-db --remote
          npx wrangler d1 migrations apply orderak-geo --remote

      - name: Deploy production API and Admin Worker
        working-directory: services/backend
        run: |
          pnpm run deploy:production
          pnpm run deploy:production:admin

      - name: Build and deploy production Admin
        working-directory: apps/admin-web
        run: |
          pnpm run deploy:production

      - name: Smoke-test production
        run: |
          curl --fail --show-error --retry 5 --retry-delay 5 https://api.orderak.app/health
          curl --fail --show-error --retry 5 --retry-delay 5 https://admin.orderak.app/

      # Runs only after the smoke test passes, so a tag means "this reached
      # production and answered", not merely "this was dispatched". A failed
      # deploy leaves no tag behind to be mistaken for a release.
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          TAG="production/$(date -u +%Y-%m-%dT%H%MZ)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; leaving it untouched."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${RELEASE_SHA}" >/dev/null
          echo "Tagged ${RELEASE_SHA} as ${TAG}"
          {
            echo "### Released ${TAG}"
            echo ""
            echo "Commit ${RELEASE_SHA} is live on api.orderak.app and admin.orderak.app"
          } >> "${GITHUB_STEP_SUMMARY}"
