







name: Backend CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile








      - name: Run backend tests
        working-directory: services/backend
        run: pnpm test

      - name: Verify D1 restore drill rejects integrity violations
        working-directory: services/backend
        run: pnpm run test:d1-restore

      - name: Lint
        working-directory: services/backend
        run: pnpm run lint

      - name: Type-check
        working-directory: services/backend
        run: pnpm run test:types

      - name: Audit dependencies (high+ critical)
        working-directory: services/backend
        run: pnpm audit --audit-level high

      - name: Verify design-system generator performance
        working-directory: services/backend
        run: pnpm run design-system:benchmark

      - name: Verify migration naming
        working-directory: services/backend
        run: pnpm run verify:migrations

      - name: Verify architecture map contracts
        working-directory: services/backend
        run: pnpm run verify:architecture

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs
