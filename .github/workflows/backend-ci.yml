







name: Backend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  # Stated here rather than inherited from the repository default. The default is
  # read today, so this changes nothing now; it means a later change to that
  # setting cannot silently widen the token this workflow runs with.
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile








      - name: Run backend tests
        working-directory: services/backend
        run: pnpm test

      - name: Verify D1 restore drill rejects integrity violations
        working-directory: services/backend
        run: pnpm run test:d1-restore

      - name: Lint
        working-directory: services/backend
        run: pnpm run lint

      - name: Type-check
        working-directory: services/backend
        run: pnpm run test:types

      # Added 2026-08-25. This check already existed, but only inside
      # staging-deploy.yml and production-deploy.yml -- so a dependency bump
      # that changes generated binding types passed every required pull-request
      # check and then failed at deploy time instead. That is exactly what
      # wrangler 4.119.0 -> 4.123.0 did: it moved workerd 1.20260801.1 ->
      # 1.20260811.1, the runtime types changed, and the first Staging deploy
      # after the merge failed on stale generated types with all 249 tests
      # green. Running it here makes the pull request carry the failure.
      - name: Generated Worker types are current
        working-directory: services/backend
        run: pnpm run cf-types:check

      - name: Audit dependencies (high+ critical)
        working-directory: services/backend
        # --ignore: see the faker note in pnpm-workspace.yaml (unfixable upstream).
        run: pnpm audit --audit-level high --ignore GHSA-qxc2-j82w-r537

      - name: Verify design-system generator performance
        working-directory: services/backend
        run: pnpm run design-system:benchmark

      - name: Verify migration naming
        working-directory: services/backend
        run: pnpm run verify:migrations

      - name: Verify architecture map contracts
        working-directory: services/backend
        run: pnpm run verify:architecture

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

  # Separate job because it needs the admin-web build that `test` has no reason
  # to produce, and because a size/startup regression is a different failure from
  # a failing test — reading it off its own red check is faster than finding it
  # in the tail of a long log.
  worker-budget:
    name: Worker size and startup budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # wrangler resolves the Admin Edge Worker's entry point through its assets
      # directory, so the Vite build has to exist or that Worker goes unmeasured.
      - name: Build admin-web
        run: pnpm --filter @orderak/admin-web run build

      - name: Verify Worker size and startup budgets
        run: node tooling/repository/verify-worker-budget.mjs
