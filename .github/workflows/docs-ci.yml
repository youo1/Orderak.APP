name: Docs CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  # Stated here rather than inherited from the repository default. The default is
  # read today, so this changes nothing now; it means a later change to that
  # setting cannot silently widen the token this workflow runs with.
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, because verify-manifest.mjs asks how many commits have
      # touched each path. Under the default depth-1 checkout every path looks
      # like it has exactly one commit, which would turn every file legitimately
      # changed since the migration into a reported defect. The verifier detects
      # that case and stops with exit 2 rather than printing the false wall, so
      # without this line the step cannot pass at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The docs scripts are invoked through pnpm because they live in the root
      # package.json. Without this the job fails at the first step with
      # "pnpm: command not found" - it did, because this workflow had not run
      # from a pnpm-based branch before.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # pnpm 11 imports node:sqlite internally, which Node 20 does not have -
          # running it there dies with ERR_UNKNOWN_BUILTIN_MODULE before any docs
          # check executes.
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Markdown lint
        run: pnpm run lint:markdown

      - name: Verify architecture map contracts
        run: node services/backend/scripts/verify-architecture-map.mjs

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

      - name: Verify local documentation links
        run: node tooling/repository/verify-doc-links.mjs

      - name: Verify documentation frontmatter and subject authority
        run: node tooling/repository/verify-doc-frontmatter.mjs

      - name: Verify documentation encoding
        run: node tooling/repository/verify-doc-encoding.mjs

      - name: Verify documentation claims about paths, scripts and resources
        run: node tooling/repository/verify-doc-claims.mjs

      # Phase 1 built this manifest from git objects at the freeze tag, and until
      # now nothing ran it — it was executed by hand when someone remembered.
      # A verification nobody automates is a verification that stops happening.
      #
      # It fails on migration defects: a file missing from the destination, a
      # dropped file that came over anyway, a row with no decision, a lost
      # executable bit, or a "regenerate" row that was copied instead. Files
      # changed by ordinary development since the migration are reported as drift
      # and do not fail the run.
      - name: Verify the migrated tree against the Phase 1 manifest
        run: node tooling/migration/verify-manifest.mjs tooling/migration/manifests/pre-migration-freeze.json .

      # The plan asks for a generated-doc drift check and there was none. Its
      # absence let a real break go unnoticed: database-migrations.md is
      # generated, so frontmatter added to it by hand survived only until the
      # next regeneration — which would then have failed
      # verify-doc-frontmatter.mjs with "no current document claims it", at
      # whatever unrelated moment someone next touched a migration.
      - name: Verify generated documentation is not stale
        run: |
          set -euo pipefail
          node services/backend/scripts/generate-migration-docs.mjs
          if ! git diff --quiet -- docs/guides/database-migrations.md; then
            echo "::error::docs/guides/database-migrations.md is out of date. Run services/backend/scripts/generate-migration-docs.mjs and commit the result."
            git diff --stat -- docs/guides/database-migrations.md
            exit 1
          fi
          echo "Generated migration reference matches its generator."

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >
            --exclude "orderak\\.app|admin\\.orderak\\.app|api\\.orderak\\.app"
            --exclude "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:|/|$)"
            --exclude-path docs/archive
            --exclude-path '(^|/)node_modules(/|$)'
            --exclude-path '^tools/'
            --no-progress
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation site
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material
          python -m mkdocs build --strict

      - name: Verify unpublished archive is absent from the built site
        run: node tooling/repository/verify-built-site.mjs site
