name: Docs CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  # Stated here rather than inherited from the repository default. The default is
  # read today, so this changes nothing now; it means a later change to that
  # setting cannot silently widen the token this workflow runs with.
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The docs scripts are invoked through pnpm because they live in the root
      # package.json. Without this the job fails at the first step with
      # "pnpm: command not found" - it did, because this workflow had not run
      # from a pnpm-based branch before.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # pnpm 11 imports node:sqlite internally, which Node 20 does not have -
          # running it there dies with ERR_UNKNOWN_BUILTIN_MODULE before any docs
          # check executes.
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Markdown lint
        run: pnpm run lint:markdown

      - name: Verify architecture map contracts
        run: node services/backend/scripts/verify-architecture-map.mjs

      - name: Verify repository and deployment map
        run: node tooling/repository/verify-deployment-map.mjs

      - name: Verify local documentation links
        run: node tooling/repository/verify-doc-links.mjs

      - name: Verify documentation frontmatter and subject authority
        run: node tooling/repository/verify-doc-frontmatter.mjs

      - name: Verify documentation encoding
        run: node tooling/repository/verify-doc-encoding.mjs

      - name: Verify documentation claims about paths, scripts and resources
        run: node tooling/repository/verify-doc-claims.mjs

      # The screen manifest drives the admin screen tree and, from phase 5, the
      # navigation model. Nothing checked it before and it had already drifted:
      # SellerProfileRoute shipped in Routes.kt and the NavHost without ever
      # being registered.
      - name: Verify app screen manifest against routes and catalogue
        run: node tooling/repository/verify-screen-manifest.mjs

      # The document said the billing gate held six routes and carved out
      # subscription/status; the code held nine and gated it. No check read a
      # prose claim about a route set, so a documented rule stopped being true
      # without anything failing.
      - name: Verify the billing gate matches its documentation
        run: node tooling/repository/verify-billing-gate.mjs

      # Colour reaches the app through the generator, and the generator's
      # contrast validation is the only gate it passes through. A value written
      # by hand arrives unchecked. The admin panel is the worked example: 34 of
      # its 51 distinct colours sit outside the system, one exception at a time.
      - name: Verify no hand-written colour in the Android app
        run: node tooling/repository/verify-no-hardcoded-colors.mjs

      # And the values colour checks cannot see. The same rule covers "duration"
      # and "radius", and neither was guarded: the app carried one duration —
      # `tween(300)` at six sites, longer than any the system names — and two
      # `RoundedCornerShape(100.dp)` pills, which is a pill on a 56dp button and
      # a different shape on anything taller.
      - name: Verify Android motion and shape stay on the design system
        run: node tooling/repository/verify-android-motion-tokens.mjs

      # And the values that are only recognisable by where they sit. A number
      # inside padding(), spacedBy() or a Spacer is a distance between two things,
      # and the system has one set of those; the auth and shop-setup flows carried
      # 46 raw literals between them, most of them off the scale entirely (6, 10,
      # 14, 18, 22, 30), so two screens meant to share a rhythm each had their own.
      # Sixteen years of renders would not have caught it. The size literals this
      # cannot classify — a 96dp ad image, a 720dp breakpoint — are deliberately
      # left alone rather than forced onto the 4dp rhythm.
      - name: Verify Android spacing and shape read the design-system tokens
        run: node tooling/repository/verify-android-spacing-tokens.mjs

      # The other half of the same rule, on the other client. The admin panel
      # carries a committed snapshot of the design system as a fallback, and the
      # live values arrive as a stylesheet from the published revision. Both
      # declare the same custom properties, so document order decided it — and
      # the bundler always put the snapshot last. Every published theme revision
      # was therefore overridden, and the only person who could have noticed was
      # the administrator whose own tab the builder restyles inline.
      - name: Verify the published theme outranks the committed bundle
        run: node tooling/repository/verify-theme-authority.mjs

      # The same rule, for the values colour checks cannot see. The admin panel
      # carries dozens of hand-picked font sizes and radii, and eight of those
      # sizes sit below the system's own 12px floor for Latin text — the smallest
      # is 9.9px. A screen that invents `font-size: .68rem` looks deliberate in
      # review and passes every other check. Weight joined the same guard: the
      # scale says 400 or 500 and the panel had 21 rules at 650/700/800/900 plus
      # five `font-semibold` classes, so three different bolds were in use that no
      # role had chosen. Every ceiling is zero.
      - name: Verify the admin panel stays on the design system
        run: node tooling/repository/verify-admin-token-conformance.mjs

      # And the other half of RD-16: one kit, not two implementations of every
      # primitive. `.button` was 38px with a hover lift where the kit's `Button` is
      # 40px with a background change; five of six modals were hand-rolled
      # `div.modal-backdrop` layers with no focus trap, while the kit had Radix's
      # dialog all along. The worst case was inside the kit. The ceilings here are
      # per file and may only go down.
      - name: Verify the admin panel has one component kit
        run: node tooling/repository/verify-admin-primitives.mjs

      # D1 is the system of record and Room is a cache of it (ADR-012). That rule
      # is only as strong as the narrowest place it can be broken, which is one
      # productDao().upsert() in a view model written by someone reasonably
      # assuming the local database is where products live. Nothing would fail;
      # the seller would see their edit and a later refresh would replace it.
      - name: Verify only the cache writers write the cache
        run: node tooling/repository/verify-cache-write-boundary.mjs

      # Room threw the database away on every schema change up to version 10, and
      # that was fine while it held nothing the server did not already have. It
      # now holds orders the server has not acknowledged. A declared version with
      # no exported schema beside it builds, ships, and throws on a phone; a
      # column removed without anyone meaning to is invisible unless someone
      # reads the exported JSON, which nobody does.
      - name: Verify the Room schema history
        run: node tooling/repository/verify-room-schema-history.mjs

      # formatAmount defaults to the ambient locale, which is right for a library
      # and wrong for a screen: the order list shipped Latin-digit money beside
      # Arabic-Indic dates in the same row until a greyscale screenshot put them
      # side by side.
      - name: Verify money formatting names its locale
        run: node tooling/repository/verify-money-locale.mjs

      # implementation_status was a claim nobody verified, and it was wrong in
      # seven places - all in the direction of understating what shipped. These
      # three keep the UX model, the catalogue and the code from parting ways.
      - name: Verify feature to surface map
        run: node tooling/ux/verify-feature-surface-map.mjs

      - name: Verify screen contracts
        run: node tooling/ux/verify-screen-contracts.mjs

      # Two surfaces edited the same store field and only one could be right. The
      # store surface checks the name against the server and keeps Save disabled
      # until it is free; the account surface carried a bare field that wrote
      # locally, whose value a later `api.register` push could make fail the whole
      # sync — while the snackbar said it saved. The field is gone and this keeps
      # it gone, because the duplicate is exactly the kind of thing a "helpful"
      # future edit re-adds.
      - name: Verify the catalogue slug has one editor
        run: node tooling/ux/verify-slug-authority.mjs

      # G4's criterion, made checkable. The panel kept two registries of its own
      # sections — the shell's `sections.ts` and `contracts/typescript/admin.ts` —
      # with nothing comparing them, and they had drifted by two entries and nine
      # groups. It also asserts that every branch states its purpose and that each
      # section is one navigation from the landing view, so the depth claim in the
      # information-architecture doc cannot go stale in silence.
      - name: Verify the admin panel's information architecture
        run: node tooling/ux/verify-admin-ia.mjs

      # The verifier decides whether the product's claims about itself are
      # true, and for a year nothing decided whether the verifier was. It
      # passed a feature whose screen has no edit control. Its own tests run
      # first so a broken guard fails as a broken guard, not as a green tick.
      - name: Test the implementation audit
        run: node --test tooling/ux/implementation-audit.test.mjs

      - name: Verify implementation status against the code
        run: node tooling/ux/verify-implementation-status.mjs

      - name: Verify every declared screen state has a design
        run: node tooling/ux/design-coverage.mjs

      # design-coverage checks that an artboard NAME appears in its own object
      # literal, so it cannot fail when a state is undrawn or unbuilt — it
      # reported the today contract fully designed while two of its four states
      # did not exist. A screenshot reference PNG cannot be written down: it is
      # there only because a @PreviewTest composed that state and the renderer
      # produced pixels. This guard counts those, and only when the render is of
      # the screen rather than of a component the screen might not even call.
      #
      # Its own tests run first, for the same reason the audit's do.
      - name: Test the render coverage guard
        run: node --test tooling/ux/render-coverage.test.mjs

      - name: Verify every claimed render has pixels behind it
        run: node tooling/ux/render-coverage.mjs

      # The plan asks for a generated-doc drift check and there was none. Its
      # absence let a real break go unnoticed: database-migrations.md is
      # generated, so frontmatter added to it by hand survived only until the
      # next regeneration — which would then have failed
      # verify-doc-frontmatter.mjs with "no current document claims it", at
      # whatever unrelated moment someone next touched a migration.
      #
      # The same absence covered the two UX documents for longer. Both declare
      # `generated: true` and name their generator in their own body text, but
      # nothing wrote either file, so the tables were only ever as fresh as the
      # last person who remembered to paste `--md` output over them. A feature
      # demoted in orderak-plan-catalog.json left feature-surface-map.md
      # asserting the old status, and the fix that reached for was editing the
      # one stale cell by hand -- which does not touch the per-surface rollup
      # counted from the same data, so the document stayed wrong in a second
      # place while looking repaired.
      - name: Verify generated documentation is not stale
        run: |
          set -euo pipefail
          node services/backend/scripts/generate-migration-docs.mjs
          node tooling/ux/generate-ux-docs.mjs
          stale=0
          for pair in             "docs/guides/database-migrations.md:services/backend/scripts/generate-migration-docs.mjs"             "docs/ux/feature-surface-map.md:tooling/ux/generate-ux-docs.mjs"             "docs/ux/screen-contracts.md:tooling/ux/generate-ux-docs.mjs"
          do
            doc="${pair%%:*}"
            gen="${pair##*:}"
            if ! git diff --quiet -- "$doc"; then
              echo "::error file=${doc}::${doc} is out of date. Run ${gen} and commit the result."
              git diff --stat -- "$doc"
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi
          echo "Generated documentation matches its generators."

      # Pages that exist and refuse automated requests, cited by the redesign's
      # open-source evaluation. Each was checked by hand: chanfana.com and the
      # Egyptian statistics portal fail from CI's network or on their own
      # certificate, and ag-grid, the Figma community plugin page and the ISO
      # country-code page answer 403 to a non-browser client. The citations are the
      # evidence for that document's verdicts, so the hosts are excluded rather than
      # the links removed - and the exclusion names the reason, so the next 403 is a
      # new entry here rather than a quietly dropped source.
      #
      # The list is below, in the args, and the explanation is here because inside a
      # folded block (`args: >`) a `#` is not a comment - it is passed to the command
      # as an argument. Written inline first, and it would have broken the check.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >
            --exclude "orderak\\.app|admin\\.orderak\\.app|api\\.orderak\\.app"
            --exclude "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)(:|/|$)"
            --exclude "^https?://chanfana\\.com"
            --exclude "^https?://www\\.ag-grid\\.com"
            --exclude "^https?://www\\.censusinfo\\.capmas\\.gov\\.eg"
            --exclude "^https?://www\\.figma\\.com/community/plugin"
            --exclude "^https?://www\\.iso\\.org/iso-3166-country-codes"
            --exclude-path docs/archive
            --exclude-path '(^|/)node_modules(/|$)'
            --exclude-path '^tools/'
            --no-progress
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation site
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material==9.7.7
          python -m mkdocs build --strict

      - name: Verify unpublished archive is absent from the built site
        run: node tooling/repository/verify-built-site.mjs site
