name: Supply Chain

# Two things the existing checks do not cover.
#
# The dependency audit ran in backend CI only, against services/backend. The
# admin web app, the OpenAPI tooling and the workspace root were never audited,
# so a high-severity advisory in any of them passed unnoticed. `pnpm audit` at
# the root covers every workspace package at once.
#
# And nothing produced an inventory of what actually ships. Without an SBOM,
# answering "are we affected by this CVE" means reconstructing the dependency
# tree by hand at exactly the moment nobody has time to.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A clean dependency tree today is not clean next week — advisories are
    # published against versions already installed.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit every workspace package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Whole workspace, not one package. High and critical fail the build;
      # moderate and low are reported without blocking, so the gate stays
      # meaningful rather than becoming noise everyone learns to ignore.
      - name: Audit (high and critical fail)
        run: pnpm audit --audit-level high

      - name: Report moderate and low
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level low || true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # CycloneDX over the installed tree, so the inventory reflects what the
      # lockfile actually resolved rather than what package.json asked for.
      - name: Build CycloneDX SBOM
        run: |
          set -euo pipefail
          # cdxgen, not @cyclonedx/cyclonedx-npm. The latter needs a
          # package-lock.json, which a pnpm workspace does not have, and pointing
          # it at the installed tree instead fails on pnpm's store layout:
          #   Error: Invalid name: ".pnpm"
          # cdxgen understands pnpm workspaces directly.
          npx --yes @cyclonedx/cdxgen@11 -t pnpm -o sbom.cyclonedx.json --no-recurse
          node -e "
            const s = require('./sbom.cyclonedx.json');
            const n = (s.components || []).length;
            if (n === 0) { console.error('SBOM contains no components - refusing to publish an empty inventory.'); process.exit(1); }
            console.log('SBOM components:', n, '| format:', s.bomFormat, s.specVersion);
          "

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          # Long enough to answer a question about a release that shipped months
          # ago, which is when an SBOM is actually wanted.
          retention-days: 90
