name: Authentication Safety Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  # Stated here rather than inherited from the repository default. The default is
  # read today, so this changes nothing now; it means a later change to that
  # setting cannot silently widen the token this workflow runs with.
  contents: read

concurrency:
  group: auth-phase1-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protected-auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject contract suspension or bypass paths
        run: node tooling/repository/verify-contract-guards.mjs

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Create CI Firebase configuration
        run: bash .github/scripts/write-ci-google-services.sh

      - name: Verify versioned contracts and Android behavioral tests
        working-directory: apps/seller-android
        run: >
          ./gradlew
          verifyAuthPhase1Contract
          verifyLocalizationContract
          verifySellerApiContract
          verifyDesignSystemContract
          testStagingDebugUnitTest

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Worker authentication tests
        working-directory: services/backend
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run test/firebase-auth.spec.ts test/identity-v2.spec.ts test/api-versioning.spec.ts
