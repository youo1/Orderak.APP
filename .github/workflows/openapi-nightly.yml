name: OpenAPI Nightly Contract and Load

# This workflow cannot pass until someone supplies seller credentials, and it is
# dispatch-only until they do.
#
# It used to run against the staging-contract-tests environment. That environment
# was deleted on 2026-08-25 having never held a single secret or variable -- so
# the jobs below no longer name it, deliberately: a job that references a missing
# environment makes GitHub recreate it, empty, and the deletion would not stick.
# CONTRACT_SELLER_PHONE and CONTRACT_SELLER_SECRET now resolve at repository
# level, where they are also unset.
#
# The preflight is what makes that safe. An earlier version of this comment
# claimed the contract job "fails its preflight rather than running blind" when
# there was no preflight at all: with the secrets unset the headers expanded to
# empty strings and the suite ran against live staging unauthenticated, which is
# precisely the blind run the sentence promised could not happen. The preflight
# below now exists and makes the claim true, which is why this workflow fails
# loudly instead of testing nothing.

# The nightly schedule was removed on 2026-08-25 along with the
# staging-contract-tests environment. It had failed every night since the
# preflight was added, because the environment never held CONTRACT_SELLER_*, and
# a job that cannot pass its own preflight is not a check -- it is a nightly
# alarm nobody can act on.
#
# Dispatch still works. To make it meaningful again, recreate an environment
# holding CONTRACT_SELLER_PHONE and CONTRACT_SELLER_SECRET, point the two jobs
# below at it, and restore the cron.
on:
  workflow_dispatch:
    inputs:
      run_pre_release:
        description: Run 200-case contract suite and pilot/spike/soak profiles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openapi-nightly-staging
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Cloudflare's staging edge applies a shared rolling request window. The
      # live config keeps the complete run below that sustained boundary. Run
      # one shard at a time so concurrent jobs cannot multiply that rate; each
      # job still gets an isolated report and runner.
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # jsonschema-rs is pinned alongside Schemathesis, not left to resolve.
      # Schemathesis 4.24.3 declared `jsonschema-rs>=0.49.0` with no upper bound, so
      # 0.50.0 satisfied it while dropping `is_satisfiable` from CanonicalSchema,
      # which 4.24.3 calls. Every run died with
      # "'builtins.CanonicalSchema' object has no attribute 'is_satisfiable'"
      # — a pinned tool broken by an unpinned dependency underneath it. That is what
      # turned OpenAPI Nightly red from 2026-08-19 onward.
      #
      # Upstream has since fixed the root cause: 4.25.0 declares
      # `jsonschema-rs>=0.50.0,<0.51.0`, so the resolver can no longer pick a version
      # that breaks it. The explicit pin below is kept anyway — an upper bound in the
      # package protects against the next 0.51, but only an exact pin makes a fuzzing
      # run reproducible, and a reproducible run is the whole point of pinning here.
      - run: pipx install schemathesis==4.25.0 --pip-args "jsonschema-rs==0.50.0"
      # Live staging is fuzzed against an opt-in allowlist of read-only operations only.
      #
      # Unfiltered, this job exercised all 68 seller operations - 37 of them mutating -
      # against real staging with --checks all and the stateful phase. That set includes
      # account deletion, passkey deletion, category deletion, email resend, Google Play
      # verification, DeepSeek chat, and media upload. A synthetic seller does not make
      # any of that safe; it only decides whose account gets deleted.
      #
      # Mutating operations are covered against the Prism mock in openapi-ci.yml, where
      # side effects have nowhere to land. The filter script fails the job if the
      # allowlist drifts from the spec or if a non-GET operation is ever added to it.
      # Coverage's synthetic unexpected-method cases are also disabled by the live
      # config. Cloudflare rejects TRACE before the Worker, and trying other undocumented
      # methods against live staging would violate this job's read-only safety boundary.
      - name: Resolve live-safe operation allowlist
        id: allowlist
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          FILTER="$(node contracts/openapi/scripts/live-fuzz-filter.mjs contracts/openapi/src/seller-v1.json "$SHARD" 8)"
          echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"

      # Fail loudly on missing credentials rather than sending empty auth headers
      # at live staging. Only emptiness is tested — never the value, never a
      # length, never a prefix — so nothing about the secret reaches the log.
      - name: Preflight required contract credentials
        env:
          CONTRACT_SELLER_PHONE: ${{ secrets.CONTRACT_SELLER_PHONE }}
          CONTRACT_SELLER_SECRET: ${{ secrets.CONTRACT_SELLER_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CONTRACT_SELLER_PHONE:-}" ]; then
            echo "::error::CONTRACT_SELLER_PHONE is not set. This workflow needs seller credentials; see the header."
            missing=1
          fi
          if [ -z "${CONTRACT_SELLER_SECRET:-}" ]; then
            echo "::error::CONTRACT_SELLER_SECRET is not set. This workflow needs seller credentials; see the header."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to run the contract suite against live staging without credentials."
            exit 1
          fi
          echo "Contract credentials are present."

      - name: Sanitized seller contract run on Staging (allowlisted operations)
        env:
          MAX_EXAMPLES: ${{ inputs.run_pre_release && '200' || '50' }}
          CONTRACT_SELLER_PHONE: ${{ secrets.CONTRACT_SELLER_PHONE }}
          CONTRACT_SELLER_SECRET: ${{ secrets.CONTRACT_SELLER_SECRET }}
          OPERATION_FILTER: ${{ steps.allowlist.outputs.filter }}
        run: >-
          schemathesis --config-file contracts/openapi/schemathesis-live.toml run contracts/openapi/src/seller-v1.json
          --url https://api.staging.orderak.app
          --phases examples,coverage,fuzzing,stateful
          --max-examples "$MAX_EXAMPLES"
          --include-operation-id-regex "$OPERATION_FILTER"
          --header "x-orderak-phone:$CONTRACT_SELLER_PHONE"
          --header "x-orderak-secret:$CONTRACT_SELLER_SECRET"
          --checks all
          --generation-deterministic
          --report junit,har
          --report-dir schemathesis-report
          --output-sanitize true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: schemathesis-nightly-sanitized-${{ matrix.shard }}
          path: schemathesis-report
          retention-days: 14

  staging-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: Low nightly load
        if: ${{ !inputs.run_pre_release }}
        run: k6 run quality/performance/k6/api-load.js
        env:
          BASE_URL: https://api.staging.orderak.app
          PROFILE: smoke
      - name: Pre-release pilot, spike, and soak
        if: ${{ inputs.run_pre_release }}
        shell: bash
        run: |
          PROFILE=pilot BASE_URL=https://api.staging.orderak.app k6 run quality/performance/k6/api-load.js
          PROFILE=spike BASE_URL=https://api.staging.orderak.app k6 run quality/performance/k6/api-load.js
          # CACHE_BUST=1 on the soak only. /api/v1/theme is served from
          # Cloudflare's edge cache, so without this the soak measures the CDN
          # and never invokes the Worker — see the comment in api-load.js.
          # A soak exists to produce a number a rollback trigger can be set
          # from, and that trigger has to fire when the Worker regresses.
          CACHE_BUST=1 PROFILE=soak BASE_URL=https://api.staging.orderak.app k6 run quality/performance/k6/api-load.js
