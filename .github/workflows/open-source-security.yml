name: Open Source Security

# Temporary private-repository replacement for CodeQL. GitHub rejects CodeQL
# result uploads unless Code Security is licensed, but that must not turn static
# analysis into a skipped or non-blocking check. Both scanners below run without
# a hosted security account, retain their reports as Actions artifacts, and fail
# CI on findings or scanner errors.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full scan so new rules and vulnerability data also cover old code.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-source-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.174.0

      - name: Scan source code
        id: semgrep
        shell: bash
        run: |
          set +e
          mkdir -p security-reports
          semgrep scan \
            --config p/default \
            --error \
            --exclude node_modules \
            --exclude site \
            --exclude '**/build/**' \
            --exclude '**/.gradle/**' \
            --sarif-output security-reports/semgrep.sarif \
            .github apps contracts packages quality services tooling
          status=$?
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          # Preserve the report before the dedicated enforcement step fails.
          exit 0

      - name: Upload Semgrep report
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: security-reports/semgrep.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Semgrep result
        if: always()
        shell: bash
        env:
          SCANNER_EXIT_CODE: ${{ steps.semgrep.outputs.exit-code }}
        run: |
          if [ -z "$SCANNER_EXIT_CODE" ]; then
            echo "::error::Semgrep did not produce an exit code. Treating this as a scanner failure."
            exit 1
          fi
          if [ "$SCANNER_EXIT_CODE" != "0" ]; then
            echo "::error::Semgrep reported findings or failed (exit code $SCANNER_EXIT_CODE). Download semgrep-sarif for details."
            exit 1
          fi

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare report directory
        run: mkdir -p security-reports

      - name: Scan dependencies, configuration, and secrets
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: security-reports/trivy.sarif
          exit-code: '1'
          skip-dirs: node_modules,site,apps/seller-android/.gradle,apps/seller-android/build

      - name: Upload Trivy report
        if: always() && hashFiles('security-reports/trivy.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: security-reports/trivy.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Trivy result
        if: always()
        shell: bash
        env:
          SCANNER_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [ "$SCANNER_OUTCOME" != "success" ]; then
            echo "::error::Trivy reported HIGH/CRITICAL findings or failed. Download trivy-sarif for details."
            exit 1
          fi
