name: D1 Backup Restore Drill

# Proves what is actually stored in R2 is recoverable — not just what was
# produced locally before encryption. d1-backup.yml's own restore drill runs
# against the plaintext export before it is encrypted and uploaded; that is a
# quality gate against a corrupt export, not proof of what ends up in R2.
# This workflow downloads the encrypted object, verifies its checksum,
# decrypts it, and runs the same restore verification against the decrypted
# output.
#
# Manual, not scheduled, and gated by credential custody rather than by a
# reviewer. This comment previously claimed the environment
# (backup-restore-staging / backup-restore-production) "has a required
# reviewer". Measured 2026-08-20: every environment in this repository reads
# protection_rules: [], this one included. Environment reviewers are not
# available on private repositories under the current plan, and this
# repository is private. There is no reviewer gate to rely on.
#
# The control that does hold is the one that was always the stronger half:
# the environment holds the only copy of the AGE private key that can ever
# leave this repository's control. The backup job itself never sees it — it
# only holds the public recipient. If the backup job's credentials leak, an
# attacker gets write access to future backups, not decrypt access to every
# past one. A job that does not declare this environment cannot decrypt
# anything, reviewer or no reviewer.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which environment's backups to restore-drill
        type: choice
        # Production only, from 2026-08-25, when backup-restore-staging was
        # deleted. Staging was the safe rehearsal target; without it this drill
        # reads real production backups, so treat a run as an operation on
        # production data rather than a practice run.
        default: production
        options:
          - production
      database:
        description: Which database to drill (one per run — each has its own backup timestamp)
        type: choice
        default: primary
        options:
          - primary
          - geo
      object_timestamp:
        description: 'Backup timestamp for THAT database, exactly as printed in its upload log, e.g. 2026-08-11T1430Z'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: d1-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backup-restore-production
    # One database per run, deliberately — this was a matrix over both.
    #
    # Each database is backed up by its own matrix leg of d1-backup.yml, and
    # those legs finish minutes apart, so their object keys carry different
    # timestamps: on 2026-08-11 the primary was 1430Z and geo was 1431Z. A
    # single object_timestamp input applied to a matrix of two therefore
    # guaranteed one leg reported object_missing every run. Found by dispatching
    # it for the first time and reading the keys, not by re-reading the file.
    #
    # A restore drill is a reviewed, deliberate act on one database. Choosing
    # that database explicitly is also the honest shape for it.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ORDERAK_RESTORE_READ }}
      DB: >-
        ${{ inputs.target == 'production'
            && (inputs.database == 'geo' && 'orderak-geo' || 'orderak-db')
            || (inputs.database == 'geo' && 'orderak-geo-staging' || 'orderak-db-staging') }}
      TS: ${{ inputs.object_timestamp }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight required restore credentials
        env:
          AGE_IDENTITY_PRESENT: ${{ secrets.AGE_IDENTITY != '' }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "ERROR: ORDERAK_RESTORE_READ is not set in this restore environment."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "${AGE_IDENTITY_PRESENT}" != "true" ]; then
            echo "ERROR: AGE_IDENTITY is not set in this restore environment."
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "Restore-drill credentials are present."

      - name: Install age (pinned, checksum-verified)
        run: bash .github/scripts/install-age.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: services/backend

      - name: Download encrypted backup and checksum from R2
        working-directory: services/backend
        run: |
          set -euo pipefail
          npx wrangler r2 object get "orderak-backups/d1/${DB}/${TS}.sql.age" \
            --file="/tmp/${DB}.sql.age" --remote
          npx wrangler r2 object get "orderak-backups/d1/${DB}/${TS}.sql.age.sha256" \
            --file="/tmp/${DB}.sql.age.sha256" --remote

      - name: Verify the stored checksum before decrypting anything
        run: |
          set -euo pipefail
          cd /tmp
          sha256sum -c "${DB}.sql.age.sha256"

      - name: Decrypt
        env:
          AGE_IDENTITY_CONTENT: ${{ secrets.AGE_IDENTITY }}
        run: |
          set -euo pipefail
          IDENTITY_FILE=$(mktemp)
          trap 'shred -u "$IDENTITY_FILE" 2>/dev/null || rm -f "$IDENTITY_FILE"' EXIT
          printf '%s' "$AGE_IDENTITY_CONTENT" > "$IDENTITY_FILE"
          age -d -i "$IDENTITY_FILE" -o "/tmp/${DB}.sql" "/tmp/${DB}.sql.age"
          echo "Decrypted: ${DB}.sql ($(wc -c < "/tmp/${DB}.sql") bytes)"

      - name: Restore drill against the decrypted object — proves what R2 actually holds
        working-directory: services/backend
        run: |
          set -euo pipefail
          node scripts/verify-d1-restore.mjs "/tmp/${DB}.sql" \
            --manifest "/tmp/${DB}.drill-manifest.json" --min-tables 1

      - name: Wipe decrypted and encrypted material from the runner
        if: always()
        run: |
          shred -u "/tmp/${DB}.sql" 2>/dev/null || rm -f "/tmp/${DB}.sql"
          shred -u "/tmp/${DB}.sql.age" 2>/dev/null || rm -f "/tmp/${DB}.sql.age"
