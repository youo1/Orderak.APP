org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# JDK selection is handled by the Gradle daemon JVM criteria
# (gradle/gradle-daemon-jvm.properties, toolchainVersion=21) so the build is not
# tied to a hardcoded Android Studio path and works on CI / other machines.
org.gradle.configuration-cache=false

# Optimized performance and resolved deprecations
android.uniquePackageNames=true
android.r8.strictFullModeForKeepRules=true
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g
