<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orderak Internal API Portal</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui.css" integrity="sha384-9Q2fpS+xeS4ffJy6CagnwoUl+4ldAYhOs9pgZuEKxypVModhmZFzeMlvVsAjf7uT" crossorigin="anonymous">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui-bundle.js" integrity="sha384-vfl/klfTFrIz5urj0HnhcXLAbzPdRHezizfy+XgFB6GqcKkhlk0lS3bIbyB39NLA" crossorigin="anonymous"></script>
  <script>
    SwaggerUIBundle({
      dom_id: '#swagger-ui',
      urls: [
        { name: 'Seller v1 — Local Prism / Staging', url: './specs/seller-v1.json' },
        { name: 'Admin v1 — Staging', url: './specs/admin-v1.json' },
        { name: 'Integrations v1 — Staging', url: './specs/integrations-v1.json' }
      ],
      deepLinking: true,
      persistAuthorization: false,
      tryItOutEnabled: true
    });
  </script>
</body>
</html>
