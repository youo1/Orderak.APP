packages:
  - "apps/*"
  - "services/*"
  - "contracts/*"

# wrangler, workerd, and @cloudflare/vitest-pool-workers resolve binaries and
# native modules assuming an npm-style flat node_modules. pnpm's default
# isolated linker breaks them, so use the hoisted linker: we keep pnpm's
# content-addressable store (and its disk savings) with a compatible layout.
nodeLinker: hoisted

# workerd, esbuild, and @sentry/cli download platform-specific binaries in a
# postinstall script — without these the Workers runtime and bundler cannot run.
# @scarf/scarf is install analytics only, so it stays disabled.
allowBuilds:
  '@scarf/scarf': false
  '@sentry/cli': true
  esbuild: true
  workerd: true

# Security overrides, workspace-wide.
#
# These must live here rather than in package.json: pnpm 11 no longer reads the
# "pnpm" field, and a per-package "overrides" block only reaches one path in
# the tree - contracts/openapi had one for lodash and the workspace still
# resolved a vulnerable copy alongside the patched one.
#
# All three entries are dev and build-time dependencies, and all three now
# reach the tree through the same place -- @stoplight/prism-cli, the OpenAPI
# mock server. Nothing the production Workers ship is involved. (This note used
# to name miniflare and Vite's PostCSS pipeline as two of the sources; those
# entries are gone and the sentence had outlived them.)
overrides:
  # GHSA-r5fr-rjxr-66jc (high) — code injection through `_.template`, plus
  # GHSA-f23m-r3pf-42rh and GHSA-xxjr-mmjv-4gpg, both prototype pollution.
  # This entry carried no explanation while the two that did were the two that
  # had stopped protecting anything. Measured 2026-08-22: removing it brings
  # 4.17.21 back and `pnpm audit` reports all three advisories.
  #
  # Same path as the uuid entry below — @stoplight/prism-cli >
  # @stoplight/http-spec > postman-collection — so the OpenAPI mock is the sole
  # source of every open advisory here. Retire Prism and all three can go.
  lodash@<4.17.24: ">=4.17.24"
  # GHSA-w5hq-g745-h8pq — missing buffer bounds check in v3/v5/v6 when buf is
  # supplied. Reaches the tree only as @stoplight/prism-cli > @stoplight/http-spec
  # > postman-collection > uuid, so it runs in the OpenAPI mock during CI and
  # never in a Worker. postman-collection calls v4 without a buf, so the flaw is
  # not reachable here; the override exists so the advisory stops being an open
  # alert that has to be re-triaged on every audit.
  uuid@<11.1.1: ">=11.1.1"
  # GHSA-fph4-wmhf-6fwf and GHSA-jqff-g426-hqxp (both high) — host confusion
  # through percent-encoded scheme normalization, and a related parsing
  # disagreement. Published after 2026-08-28, which is why an audit that had
  # been green since then began failing every pull request at once.
  #
  # Reaches the tree only as @stoplight/prism-cli > @stoplight/prism-http >
  # ajv > fast-uri (and the ajv-formats variant of the same path), so it runs
  # in schema validation inside the OpenAPI mock and never in a Worker. One
  # copy was resolved, 3.1.5; the advisory is fixed in 3.1.6 and this pins past
  # it to 3.1.7 to avoid re-triaging the same alert on the next audit.
  #
  # The upper bound is load-bearing. ajv 8.20.0 declares `fast-uri: ^3.0.1`, and
  # an open-ended ">=3.1.7" resolves to 4.x, overriding ajv past the range it
  # says it supports -- an audit-green tree whose URI resolution is untested
  # against its consumer. Keep this inside major 3 until ajv widens its range.
  fast-uri@<3.1.6: ">=3.1.7 <4"
  # GHSA-x5fp-wj9c-mxmx (moderate) — the array limit can be bypassed by comma
  # parsing inside a bracket key, so a crafted query string allocates past the
  # cap the limit exists to impose. Plus GHSA-4mjr-xmp4-gh2g (moderate), denial
  # of service through an attacker-controlled `isBuffer`. Fixed in 6.15.4 and
  # 6.16.0 respectively, so one pin past both closes both.
  #
  # Reaches the tree only as @stoplight/prism-cli > @stoplight/json-schema-ref-parser
  # > url > qs, so it parses nothing but the OpenAPI mock's own arguments during
  # CI and never runs in a Worker.
  #
  # No upper bound is needed, unlike fast-uri above: `url@0.11.4` declares
  # `qs: ^6.12.3`, and 6.16.0 is inside that range rather than past it. This is
  # the case that entry refuses — a consumer handed a version it never declared
  # support for — and it does not arise here.
  qs@<6.16.0: ">=6.16.0"
  # GHSA-2883-xcg3-v3hh (high) — `maxTotalMergeKeys` does not bound CPU use for
  # empty merge sources, so a crafted YAML document can spin the parser. Fixed
  # in 3.15.2, the last 3.x release before js-yaml moved to its 4.x rewrite.
  #
  # Reaches the tree only as @stoplight/prism-cli > ... > json-schema-faker >
  # json-schema-ref-parser > js-yaml, three separate paths through the same
  # OpenAPI mock dependency, so it parses YAML nowhere but inside Prism during
  # CI and never in a Worker.
  #
  # The upper bound is load-bearing, and this one was measured rather than
  # reasoned: json-schema-ref-parser@6.1.0 declares `js-yaml: ^3.12.1`, so 3.15.2
  # is inside its range — but an override *replaces* the range instead of
  # narrowing it, so a bare ">=3.15.2" resolved to 5.4.1, two majors past what
  # the consumer declares. Held inside major 3 this is 3.15.1 to 3.15.2, a patch
  # within the minor already resolved. Same hazard as fast-uri, same fix.
  js-yaml@<3.15.2: ">=3.15.2 <4"

# Two advisories are not fixed here, because neither fix is one this tree can
# take.
#
# GHSA-qxc2-j82w-r537 (high) — @faker-js/faker's `helpers.fake()` evaluates the
# template string it is handed, so a caller that passes attacker-controlled text
# into it gets arbitrary code execution. Patched in 10.4.1.
#
# The vulnerable copy is 5.5.3, and the only thing asking for it is
# postman-collection 4.5.0 — which does not declare a range that could resolve
# to the fix. It pins `"@faker-js/faker": "5.5.3"` exactly. An override to
# >=10.4.1 therefore does not upgrade postman-collection; it hands it a library
# five majors from the one it was written against, which is the trade the
# fast-uri upper bound above exists to refuse: a green audit over a dependency
# that has never been exercised against its consumer.
#
# Prism's own copy is 10.5.0 and is not affected — that is the one the dynamic
# mock generates data with. postman-collection is reached only when Prism is
# given a Postman collection to parse, and the single place that runs Prism
# hands it an OpenAPI document (`prism mock src/seller-v1.json --dynamic`, in
# contracts/openapi). Nothing here reaches `helpers.fake()` at all.
#
# So this is ignored rather than silenced generally: one GHSA id, not a
# severity threshold or a package. If postman-collection widens its pin, the
# override belongs above and this entry goes. Retire Prism and this entry goes
# with all three overrides.
# GHSA-rgj7-g3m4-5g8c (high) — heap overflows in the libheif decoder sharp
# bundles, reached through HEIF/AVIF input. Patched in sharp 0.35.4.
#
# sharp reaches this tree only under miniflare, which arrives through the
# wrangler dev server and @cloudflare/vitest-pool-workers. A Worker never
# bundles sharp, so nothing in any deployed artifact decodes an image with it;
# the exposure is a local dev server and the test pool decoding input a
# developer already supplied.
#
# It is ignored rather than overridden for the same reason as faker below, and
# the reason was measured. wrangler 4.131.0 — already the resolved version for
# both workspaces that declare it, and the newest in `^4.131.0` — depends on
# miniflare 5.20260910.0-alpha, which pins sharp 0.35.4 and is clean. The one
# remaining source is @cloudflare/vitest-pool-workers@0.22.0, which pins
# `wrangler: 4.124.0` and `miniflare: 5.20260815.0-alpha` exactly, not as
# ranges. Overriding either hands it a version it never declared support for —
# the trade the fast-uri upper bound exists to refuse. 0.22.0 is the latest
# published release, so there is no in-range or out-of-range upgrade to take.
#
# This entry goes when Cloudflare ships a vitest-pool-workers built on
# miniflare 5.20260910.0-alpha or later. Re-check on the next audit failure.
auditConfig:
  ignoreGhsas:
    - GHSA-qxc2-j82w-r537
    - GHSA-rgj7-g3m4-5g8c

minimumReleaseAgeExclude:
  - miniflare@5.20260910.0-alpha
  - wrangler@4.131.0
